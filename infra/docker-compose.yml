# Infraestructura self-contained para tonfort (carpintería)
# Caddy hace TLS automático (Let's Encrypt).
# Requiere Docker y un dominio apuntando a este VPS.
#
# Uso (desde la RAÍZ del repo):
#   1. cp .env.example .env  y completa los valores reales.
#   2. docker compose up -d
#
# NOTA: no incluye n8n ni saas; cada repo se despliega de forma independiente.

services:
  carpinteria-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${CARPINTERIA_WHATSAPP_NUMBER}
        NEXT_PUBLIC_INSTAGRAM_HANDLE: ${CARPINTERIA_INSTAGRAM_HANDLE}
        NEXT_PUBLIC_EMAIL: ${CARPINTERIA_EMAIL}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - CARPINTERIA_SUPABASE_URL=${CARPINTERIA_SUPABASE_URL}
      - CARPINTERIA_SUPABASE_SERVICE_ROLE_KEY=${CARPINTERIA_SUPABASE_SERVICE_ROLE_KEY}
      - CARPINTERIA_SUPABASE_ANON_KEY=${CARPINTERIA_SUPABASE_ANON_KEY}
      - STAFF_CREDENTIALS=${STAFF_CREDENTIALS}
      - SESSION_SECRET=${SESSION_SECRET}
      - LLM_PROVIDER=${LLM_PROVIDER}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
    depends_on:
      - caddy
    networks:
      - carpinteria_net

  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CADDY_EMAIL=${CADDY_EMAIL}
      - DOMAIN=${DOMAIN}
      - CARPINTERIA_HOST=${CARPINTERIA_HOST}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - carpinteria_net

volumes:
  caddy_data:
  caddy_config:

networks:
  carpinteria_net:
    driver: bridge
