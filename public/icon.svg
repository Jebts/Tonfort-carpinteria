<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <style>
      .tonfort-t { fill: #0B1D3A; }
      .tonfort-bg { fill: #E8DFD0; }
    </style>
  </defs>
  <!-- Fondo redondeado (modo claro por defecto) -->
  <rect width="32" height="32" rx="7" class="tonfort-bg"/>
  <!-- Letra T de Tonfort -->
  <rect x="10" y="3" width="12" height="24" rx="2" class="tonfort-t"/>
  <rect x="6" y="3" width="20" height="4" rx="2" class="tonfort-t"/>
</svg>